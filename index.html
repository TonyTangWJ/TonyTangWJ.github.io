    <style>
      :root {

        justify-content: space-between;

        color: var(--violet);

      .contact {
        padding-top: clamp(2.5rem, 8vw, 4rem);
        font-size: clamp(.95rem, 2.4vw, 1.05rem);
      }

      .contact a { color: var(--violet); font-weight: 700; overflow-wrap: anywhere; text-decoration: none; }
      .contact a:hover { text-decoration: underline; text-underline-offset: 4px; }
