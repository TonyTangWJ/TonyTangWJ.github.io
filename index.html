<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wenjun Tang</title>
    <style>
      :root {
        --violet: #a100ff;
        --ink: #171717;
        --surface: #ffffff;
        --header-mark-size: clamp(2.5rem, 6vw, 3.25rem);
      }

      * { box-sizing: border-box; }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        margin: 0;
        color: var(--ink);
        background: var(--surface);
        font-family: "Aptos", "Segoe UI", sans-serif;
      }

      .header, .device-info, .contact-content {
        width: min(1180px, calc(100% - clamp(2rem, 5vw, 3rem)));
        margin: 0 auto;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: clamp(4.125rem, 9vw, 5.125rem);
        border-bottom: 1px solid #dedede;
      }

      .accenture-logo {
        display: grid;
        place-items: center;
        width: var(--header-mark-size);
        aspect-ratio: 1;
        color: var(--violet);
        font-size: clamp(2.25rem, 5vw, 2.75rem);
        font-weight: 800;
        line-height: 1;
      }

      .profile-photo {
        width: var(--header-mark-size);
        aspect-ratio: 1;
        border-radius: 50%;
        object-fit: cover;
        object-position: center;
      }

      .device-info {
        padding-top: clamp(2.5rem, 8vw, 4rem);
        font-size: clamp(.95rem, 2.4vw, 1.05rem);
      }

      .authorization { margin-bottom: .5rem; }

      .contact {
        margin-top: auto;
        padding: clamp(1.5rem, 5vw, 2.5rem) 0;
        background: #f4e6ff;
        font-size: clamp(.95rem, 2.4vw, 1.05rem);
      }

      .contact a { color: var(--violet); font-weight: 700; overflow-wrap: anywhere; text-decoration: none; }
      .contact a:hover { text-decoration: underline; text-underline-offset: 4px; }

    </style>
  </head>
  <body>
    <header class="header">
      <span class="accenture-logo" role="img" aria-label="Accenture logo">&gt;</span>
      <img class="profile-photo" src="husky.jpg" alt="Husky profile photo">
    </header>
    <main class="device-info" aria-live="polite" aria-busy="true">
      <div id="authorizations">Loading...</div>
    </main>
    <footer class="contact">
      <div class="contact-content">Contact me: <a href="mailto:wenjun.a.tang@accenture.cn" data-encryption="planned">wenjun.a.tang@accenture.cn</a></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script>
      const main = document.querySelector("main");

      async function loadAuthenticator() {
        try {
          const response = await fetch("authenticator.yml", { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const authenticator = jsyaml.load(await response.text());
          const users = authenticator?.USER;
          if (!Array.isArray(users) || users.length === 0 || users.some(({ Name, DeviceHash, Signature }) => typeof Name !== "string" || typeof DeviceHash !== "string" || typeof Signature !== "string")) {
            throw new Error("Invalid authenticator.yml format");
          }

          const authorizations = document.querySelector("#authorizations");
          authorizations.replaceChildren(...users.map(({ Name, DeviceHash, Signature }) => {
            const authorization = document.createElement("div");
            authorization.className = "authorization";
            authorization.dataset.name = Name;
            authorization.dataset.signature = Signature;
            authorization.textContent = `DeviceHash: ${DeviceHash}`;
            return authorization;
          }));
        } catch (error) {
          document.querySelector("#authorizations").textContent = "Unavailable";
        } finally {
          main.setAttribute("aria-busy", "false");
        }
      }

      loadAuthenticator();
    </script>
  </body>
</html>
